name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Require release signing secrets
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KS_B64" || { echo "::error::Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KS_PASS" || { echo "::error::Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KS_ALIAS" || { echo "::error::Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "::error::Missing KEY_PASSWORD"; exit 1; }

      - name: Decode and verify keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # strip any whitespace/newlines/quotes the paste may have picked up
          CLEAN=$(printf '%s' "$KS_B64" | tr -d '[:space:]"'"'")
          printf '%s' "$CLEAN" | base64 -d > keystore.jks 2>/dev/null \
            || printf '%s' "$CLEAN" | base64 -di > keystore.jks
          # verify it is a real keystore and the password opens it —
          # fails HERE with a clear message instead of mid-build
          keytool -list -keystore keystore.jks -storepass "$KS_PASS" > /dev/null
          echo "Keystore decoded and verified OK"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/KeyMSG-${{ github.ref_name }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # every build starts life as a tester prerelease; promoting to all
          # users = unchecking "pre-release" on GitHub (the in-app updater
          # follows releases/latest, which ignores prereleases)
          prerelease: true
          files: app/build/outputs/apk/release/KeyMSG-${{ github.ref_name }}.apk
          generate_release_notes: true
